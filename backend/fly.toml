# fly.toml app configuration file generated for spherex-blink-backend on 2026-11-14T21:51:52-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'spherex-blink-backend'
primary_region = 'dfw'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
