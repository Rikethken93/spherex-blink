# fly.toml app configuration file generated for spherex-blink-backend on 2026-11-14T21:51:52-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'spherex-blink-backend'
primary_region = 'dfw'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine always warm through the judging window: scale-to-zero
  # made every first visit pay a multi-second cold start (observed live,
  # 2026-11-15: 6.2s for /api/health, and the first page load sometimes
  # erroring outright while the proxy woke a machine). The trial 5-minute
  # cap is already lifted (payment method added -- see docs/qa/QA_REPORT.md),
  # so a single warm shared-cpu machine is safe to keep running.
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
